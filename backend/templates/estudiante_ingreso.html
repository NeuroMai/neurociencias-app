<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ingreso de Datos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .btn-red { background-color: #d9534f; color: white; border: none; }
        .btn-red:hover { background-color: #c9302c; color: white; }
    </style>
</head>
<body class="py-5">
    <div class="container" style="max-width: 500px;">
        <div class="card shadow border-0 p-4">
            <h3 class="card-title text-center fw-bold mb-3">{{ evaluacion.titulo }}</h3>
            
            {% if error %}
                <div class="alert alert-danger text-center">{{ error }}</div>
            {% endif %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">Nombre Completo:</label>
                    <input type="text" name="nombre" class="form-control" required placeholder="Ej: María Pérez">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">RUT:</label>
                    <input type="text" name="rut" class="form-control" required placeholder="12.345.678-K">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Sección:</label>
                    <input type="text" name="seccion" class="form-control" value="{{ evaluacion.seccion }}" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold text-danger">🔑 Código de Acceso del Examen:</label>
                    <input type="text" name="codigo_acceso" class="form-control text-uppercase fw-bold fs-5 text-center" style="letter-spacing: 3px;" required placeholder="Ej: 3AP4T5">
                    <small class="text-muted">Proporcionado por el docente al inicio del examen.</small>
                </div>
                <button type="submit" class="btn btn-red w-100 btn-lg fw-bold">Continuar</button>
            </form>
        </div>
    </div>
</body>
</html>
