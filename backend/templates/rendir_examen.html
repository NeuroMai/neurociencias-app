<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rendir Examen - Neurociencias</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>
<body>

    <!-- 🔒 MARCA DE AGUA DINÁMICA -->
    <div class="watermark-container">
      {% for i in range(16) %}
        <div class="watermark-item">
          {{ estudiante.nombre }} — RUT: {{ estudiante.rut }}
        </div>
      {% endfor %}
    </div>

    <!-- AQUÍ CONTINÚA EL CONTENIDO NORMAL DE TU EXAMEN -->
    <div class="container">
        <h1>Evaluación de Neurociencias</h1>
        
        <form action="/guardar_examen" method="POST">
            <div class="pregunta">
                <p>1. ¿Cuál es la función principal de los neurotransmisores?</p>
                <label><input type="radio" name="p1" value="a"> Opción A</label><br>
                <label><input type="radio" name="p1" value="b"> Opción B</label>
            </div>
            
            <button type="submit" class="btn">Enviar Examen</button>
        </form>
    </div>

</body>
</html>
