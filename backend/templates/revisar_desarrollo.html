{% extends 'base.html' %}
{% block content %}
<h2>Revisar Preguntas de Desarrollo</h2>
<p><strong>Estudiante:</strong> {{ intento.estudiante_nombre }} | <strong>Sección:</strong> {{ intento.seccion }}</p>

<form method="POST">
  {% for r in respuestas %}
    <div class="card-pregunta">
      <p><strong>Pregunta:</strong> {{ r.enunciado }}</p>
      <p style="background: white; padding: 10px; border: 1px solid #ddd;">
        <strong>Respuesta del alumno:</strong><br>{{ r.respuesta_texto }}
      </p>
      <label>Asignar Puntaje (Máximo {{ r.puntaje_maximo }} pt.):</label>
      <input type="number" step="0.5" name="puntaje_{{ r.id }}" value="{{ r.puntaje_asignado or 0 }}" max="{{ r.puntaje_maximo }}" min="0">
    </div>
  {% endfor %}

  <button type="submit" class="btn-udp">Guardar Calificación de Desarrollo</button>
</form>
{% endblock %}
