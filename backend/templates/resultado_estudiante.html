<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Evaluación Enviada</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #212529; color: #ffffff; }
        .card-final { background-color: #ffffff; color: #212529; border-top: 6px solid #d9534f; }
    </style>
</head>
<body class="py-5 text-center">
    <div class="container" style="max-width: 550px;">
        <div class="card card-final shadow-lg p-5 rounded">
            <div class="mb-4">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo UDP" style="max-height: 100px;" onerror="this.style.display='none'">
            </div>
            <h2 class="fw-bold mb-3">Evaluación Entregada</h2>
            <p class="fs-5 text-secondary mb-3">
                Tus respuestas han sido registradas e ingresadas con éxito en el sistema.
            </p>

            <!-- Cuadro con el puntaje -->
            <div class="alert alert-secondary py-3 my-4">
                <span class="d-block text-muted small uppercase fw-bold">Puntaje obtenido</span>
                <span class="fs-2 fw-bold text-dark">
                    {{ intento.puntaje_autocorregido }} / {{ intento.puntaje_total_auto }} pts
                </span>
            </div>

            <div class="p-3 bg-light rounded text-muted fs-6">
                Puedes cerrar esta página o ventana sin problemas.
            </div>
        </div>
    </div>
</body>
</html>
